name: 'RelayDispatch Dependency Installation'
description: 'Standardized dependency installation workflow using clean npm installs'
inputs:
  working-directory:
    description: 'Working directory context'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: Clean install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        npm ci \
          --ignore-scripts \
          --fund=false \
          --audit=false

    - name: Verify dependency tree
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ls >/dev/null

    - name: Verify workspace configuration
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm pkg get name
