name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  node-verify:
    name: Node Quality Gate
    uses: ./.github/workflows/node.yml
    with:
      node-version: '24'
      run-lint: true

  testing:
    name: Execute Tests
    needs: node-verify
    uses: ./.github/workflows/test.yml
    with:
      node-version: '24'
      test-command: 'test:coverage'
      upload-coverage: true

  build-verify:
    name: Build Verification
    needs: node-verify
    uses: ./.github/workflows/build.yml
    with:
      node-version: '24'
      build-command: 'build'
      artifact-name: 'ci-build-dist'

  docker-smoke-build:
    name: Docker Smoke Build
    needs: build-verify
    uses: ./.github/workflows/docker.yml
    with:
      image-name: relaydispatch/relaydispatch
      push: false
