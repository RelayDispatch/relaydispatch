# .github/workflows/release.yml
# ─────────────────────────────────────────────────────────────
# RelayDispatch — Release Pipeline
#
# Trigger: push of a version tag (e.g. v1.2.3)
#
# Jobs:
#   validate   — Verify tag format, changelog entry, and test suite
#   build      — Build all production bundles
#   docker     — Build + push multi-arch Docker image to GHCR
#   release    — Create GitHub Release with built assets + SBOM
#   notify     — Post release announcement to Discord webhook (optional)
#
# Required Secrets:
#   GITHUB_TOKEN          — Auto-provided (release + GHCR push)
#   DISCORD_RELEASE_HOOK  — Discord webhook URL (optional)
#
# Image tags pushed:
#   ghcr.io/ORG/relaydispatch:v1.2.3
#   ghcr.io/ORG/relaydispatch:1.2
#   ghcr.io/ORG/relaydispatch:latest
#
# SLSA provenance attestation is generated for all release assets.
# ─────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # e.g. v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'  # e.g. v1.2.3-rc.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a release in progress

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/relaydispatch

jobs:
  # ── Job 1: Validate release tag + test suite ─────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "🏷️  Releasing: ${VERSION}"

      - name: Verify CHANGELOG.md contains this version
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md does not have an entry for [${VERSION}]"
            echo "   Add a ## [${VERSION}] section before tagging a release."
            exit 1
          fi
          echo "✅ CHANGELOG.md entry found for [${VERSION}]"

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite (release gate)
        run: npm test
        env:
          VAULT_ENCRYPTION_KEY: cc2df5bd177d37b8e2f3c20c54278818d4071bee82f7c704322ca863224155b2
          NODE_ENV: test

  # ── Job 2: Build production bundles ─────────────────────────
  build:
    name: Build Release Bundles
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Generate SBOM for release
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom.cdx.json

      - name: Package release archive
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          tar -czf "relaydispatch-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.test.ts' \
            --exclude='tests/' \
            dist/ apps/api/dist/ packages/*/dist/ docker-compose*.yml \
            README.md CHANGELOG.md LICENSE SELF_HOSTING.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ needs.validate.outputs.version }}
          path: |
            relaydispatch-*.tar.gz
            sbom.cdx.json
          retention-days: 30

  # ── Job 3: Multi-arch Docker build + push to GHCR ───────────
  docker:
    name: Docker — Build & Push
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: read
      packages: write
      id-token: write   # for SLSA provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.validate.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest image build provenance (SLSA Level 2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ── Job 4: Create GitHub Release ────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build, docker]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ needs.validate.outputs.version }}
          path: release-assets/

      - name: Extract CHANGELOG entry for this release
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Extract the section between ## [VERSION] and the next ## heading
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "${NOTES}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RelayDispatch v${{ needs.validate.outputs.version }}
          body: |
            ## RelayDispatch v${{ needs.validate.outputs.version }}

            ### Docker

            ```bash
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.version }}
            ```

            ### Self-Hosted Install

            See [SELF_HOSTING.md](https://github.com/${{ github.repository }}/blob/main/SELF_HOSTING.md) for full installation instructions.

            ### Changes

            ${{ steps.changelog.outputs.notes }}

            ---
            > 🔒 SBOM and SLSA provenance attestation are attached to this release.
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          draft: false
          files: |
            release-assets/relaydispatch-*.tar.gz
            release-assets/sbom.cdx.json

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/relaydispatch-*.tar.gz

  # ── Job 5: Discord release notification (optional) ───────────
  notify:
    name: Release Notification
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: needs.validate.outputs.is_prerelease == 'false' && secrets.DISCORD_RELEASE_HOOK != ''
    steps:
      - name: Post Discord announcement
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "🚀 RelayDispatch v${VERSION} Released",
              "description": "A new production release of RelayDispatch is now available.",
              "color": 5763719,
              "fields": [
                { "name": "Version",  "value": "v${VERSION}", "inline": true },
                { "name": "Docker",   "value": "\`docker pull ghcr.io/${{ env.IMAGE_NAME }}:${VERSION}\`", "inline": false },
                { "name": "Release Notes", "value": "[View on GitHub](https://github.com/${{ github.repository }}/releases/tag/v${VERSION})", "inline": false }
              ]
            }]
          }
          EOF
          )
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${{ secrets.DISCORD_RELEASE_HOOK }}"
